  <article id="doc"><p id="loading">Loading…</p></article>
</main>
<script>
  // Protect math from the Markdown parser, render Markdown, then typeset math.
  window.addEventListener('DOMContentLoaded', async () => {
    const el = document.getElementById('doc');
    try {
      const md = await (await fetch('cube_algebra_theory.md')).text();
      const stash = [];
      const protectedMd = md
        .replace(/\$\$[\s\S]+?\$\$/g, m => `\u0000${stash.push(m) - 1}\u0000`)
        .replace(/\$[^$\n]+?\$/g, m => `\u0000${stash.push(m) - 1}\u0000`);
      let html = marked.parse(protectedMd, { mangle: false, headerIds: true });
      html = html.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
      el.innerHTML = html;
      renderMathInElement(el, {
        delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}],
        throwOnError: false
      });
      const h1 = el.querySelector('h1'); if (h1) document.title = h1.textContent;
    } catch (e) {
      el.innerHTML = '<p>Could not load the document. <a href="cube_algebra_theory.md">Open the Markdown source</a>.</p>';
    }
  });
</script>
