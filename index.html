<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thanh Nguyen</title>
  <meta name="description" content="Thanh (Albert) Nguyen, software engineer. An interactive portrait you can ask questions. Plain-text version at /about.md, question bank at /qa.json.">
  <link rel="alternate" type="text/markdown" href="about.md" title="This site as Markdown">
  <link rel="alternate" type="application/json" href="qa.json" title="Question bank behind the chat">
  <link rel="icon" type="image/svg+xml" href="media/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thanh Nguyen">
  <meta property="og:description" content="Ask me anything. Systems engineer; builds browser tools, math write-ups and learning aids.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg: #faf9f6; --ink: #1c1c1e; --muted: #7a7a80; --line: #e3e0d8;
      --card: rgba(255,255,255,0.94); --shadow: 0 6px 24px rgba(0,0,0,0.08); --accent: #b4532a; --accent-soft: #f6e9e1;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #101114; --ink: #ece9e2; --muted: #8f8f98; --line: #2b2c32;
              --card: rgba(24,25,30,0.94); --accent: #e8926a; --accent-soft: #2b1f19; --shadow: 0 6px 24px rgba(0,0,0,0.4); }
    }
    :root[data-theme="dark"] { --bg: #101114; --ink: #ece9e2; --muted: #8f8f98; --line: #2b2c32;
              --card: rgba(24,25,30,0.94); --accent: #e8926a; --accent-soft: #2b1f19; --shadow: 0 6px 24px rgba(0,0,0,0.4); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }

    #ui {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      width: min(640px, 92vw);
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }

    #you { font-size: 0.9rem; color: var(--muted); align-self: flex-start; margin-left: 14px; padding: 4px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); opacity: 0; transition: opacity .4s; }
    #you:empty { display: none; }
    #you.show { opacity: 1; }

    #say {
      font-size: clamp(1.05rem, 2.3vw, 1.3rem); line-height: 1.5;
      padding: 16px 20px; border-radius: 18px;
      background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line); box-shadow: var(--shadow);
      opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s;
    }
    #say.show { opacity: 1; transform: none; }
    #say:empty { display: none; }
    #say .caret { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { to { visibility: hidden; } }

    #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 4px; }
    #chips:empty { display: none; }
    .chip {
      font: inherit; font-size: 0.9rem; color: var(--ink); cursor: pointer;
      padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      text-decoration: none; opacity: 0; animation: rise .4s forwards;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.link { color: var(--accent); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

    #suggest {
      list-style: none; margin: 0; padding: 6px; border-radius: 16px;
      background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    #suggest:empty { display: none; }
    #suggest li { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
    #suggest li.active, #suggest li:hover { background: var(--accent-soft); }

    form { position: relative; margin: 0; }
    #q {
      width: 100%; font: inherit; font-size: 1.2rem; color: var(--ink);
      padding: 15px 20px; border-radius: 999px; outline: none;
      border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: border-color .2s, box-shadow .2s;
    }
    #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    #hint {
      position: absolute; left: 21px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 1.2rem; pointer-events: none;
      transition: opacity .5s; white-space: nowrap; overflow: hidden; max-width: calc(100% - 42px); text-overflow: ellipsis;
    }
    #hint.hide { opacity: 0; }

    noscript img { display: block; max-width: 100%; margin: 0 auto; }
    noscript p { text-align: center; }
    @media (prefers-reduced-motion: reduce) { .chip { animation: none; opacity: 1; } #say .caret { animation: none; } }
  </style>
</head>
<body>
  <video id="src" muted playsinline autoplay preload="auto" aria-hidden="true" tabindex="-1">
    <source src="media/hero.webm" type="video/webm">
    <source src="media/hero.mp4" type="video/mp4">
  </video>
  <canvas id="stage" role="img" aria-label="Thanh Nguyen, drawn live as ink dots from a short video"></canvas>

  <div id="ui">
    <div id="you"></div>
    <div id="say" aria-live="polite"></div>
    <div id="chips"></div>
    <ul id="suggest" role="listbox"></ul>
    <form id="ask" autocomplete="off">
      <input id="q" type="text" aria-label="Ask me anything" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send">
      <span id="hint">Ask me anything</span>
    </form>
  </div>

  <noscript>
    <img src="media/avatar.svg" alt="Thanh Nguyen, halftone portrait" width="960" height="720">
    <p>Thanh (Albert) Nguyen, software engineer. <a href="about.md">Read about me</a> · <a href="https://github.com/traceformula">GitHub</a></p>
  </noscript>

<script>
(() => {
  // ---------- portrait ----------
  const V = document.getElementById('src');
  const C = document.getElementById('stage');
  const X = C.getContext('2d');
  const off = document.createElement('canvas');
  const OX = off.getContext('2d', { willReadFrequently: true });
  const poster = new Image(); poster.src = 'media/hero-poster.jpg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, cols, rows, cell, lum, bg, ink, dark = false;
  let mouth = { x: 0, y: 0 };
  const mouse = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4, inside: false };
  let ripples = [];
  let speaking = false, flexing = false, primed = false;

  function theme() {
    const s = getComputedStyle(document.documentElement);
    bg = s.getPropertyValue('--bg').trim(); ink = s.getPropertyValue('--ink').trim();
    const forced = document.documentElement.dataset.theme;
    dark = forced ? forced === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    C.width = W * dpr; C.height = H * dpr; C.style.width = W + 'px'; C.style.height = H + 'px';
    X.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.max(11, Math.min(24, Math.min(W, H) / 42));
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
    off.width = cols; off.height = rows;
    lum = new Float32Array(cols * rows);
  }
  function sample() {
    const src = V.readyState >= 2 ? V : (poster.complete && poster.naturalWidth ? poster : null);
    if (!src) return false;
    // Fit by height with a little zoom; the sides of the clip are plain wall.
    const va = 4 / 3;
    const dh = rows * 1.12, dw = dh * va, dx = (cols - dw) / 2, dy = -(dh - rows) * 0.35;
    OX.fillStyle = '#fff'; OX.fillRect(0, 0, cols, rows);
    OX.drawImage(src, dx, dy, dw, dh);
    const d = OX.getImageData(0, 0, cols, rows).data;
    // Light theme: ink dots sized by darkness. Dark theme: light dots sized by brightness.
    // Soft fade at the clip's left and right edges so no rectangle shows.
    const fade = new Float32Array(cols);
    for (let c = 0; c < cols; c++) { const u = (c + 0.5 - dx) / dw; const e = Math.min(u, 1 - u) / 0.1; fade[c] = e <= 0 ? 0 : e >= 1 ? 1 : e * e * (3 - 2 * e); }
    for (let r = 0, i = 0, j = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++, i++, j += 4) {
        const l = (d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114) / 255;
        const v = dark ? l : 1 - l;
        lum[i] = Math.pow(v, dark ? 1.25 : 1.45) * fade[c];
      }
    }
    mouth.x = (dx + 0.5 * dw) * cell; mouth.y = (dy + 0.62 * dh) * cell;
    return true;
  }
  function ripple(x, y, amp, life) { if (!reduce) ripples.push({ x, y, amp, life, t: performance.now() }); }

  let lastSample = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - lastSample > 33 || flexing) { sample(); lastSample = t; }
    X.fillStyle = bg; X.fillRect(0, 0, W, H);
    X.fillStyle = ink;
    mouse.x += (mouse.tx - mouse.x) * 0.15; mouse.y += (mouse.ty - mouse.y) * 0.15;
    const jit = (reduce || !speaking) ? 0 : 0.7;
    const par = (!reduce && mouse.inside) ? 1 : 0;
    const px = ((mouse.x / W) - 0.5) * 10 * par, py = ((mouse.y / H) - 0.5) * 10 * par;
    const breath = reduce ? 1 : 1 + 0.004 * Math.sin(t / 1700);
    const cx = W / 2, cy = H * 0.62;
    const R = 90, R2 = R * R;
    const uiTop = H * 0.55, fadeSpan = H - uiTop;
    const live = [];
    for (const rp of ripples) { const age = t - rp.t; if (age < rp.life) { rp.age = age; rp.rad = age * 0.4; rp.k = rp.amp * (1 - age / rp.life); live.push(rp); } }
    ripples = live;
    X.beginPath();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let d = lum[r * cols + c];
        if (d < (dark ? 0.2 : 0.14)) continue;
        let x = (c + 0.5) * cell, y = (r + 0.5) * cell;
        x = cx + (x - cx) * breath + px; y = cy + (y - cy) * breath + py;
        const ddx = x - mouse.x, ddy = y - mouse.y, dist2 = ddx * ddx + ddy * ddy;
        if (dist2 < R2) { const dist = Math.sqrt(dist2) || 1, f = (R - dist) / R; x += ddx / dist * f * 10; y += ddy / dist * f * 10; }
        let m = 1;
        for (const rp of live) { const dr = Math.hypot(x - rp.x, y - rp.y) - rp.rad; if (dr > -44 && dr < 44) m += Math.cos(dr / 44 * 1.5708) * rp.k; }
        if (jit && Math.abs(y - mouth.y) < 150 && Math.abs(x - mouth.x) < 150) { x += (Math.random() - 0.5) * jit * 2; y += (Math.random() - 0.5) * jit * 2; }
        // Dots thin out toward the bottom where the conversation sits.
        if (y > uiTop) m *= 1 - 0.65 * Math.min(1, (y - uiTop) / fadeSpan);
        const rad = Math.max(0, cell * (dark ? 0.44 : 0.56) * Math.sqrt(d) * m);
        X.moveTo(x + rad, y); X.arc(x, y, rad, 0, 6.2832);
      }
    }
    X.fill();
  }

  // Idle = paused on the neutral first frame. flex() plays the clip once.
  function prime() {
    if (primed) return; primed = true;
    const p = V.play(); if (p && p.catch) p.catch(() => { primed = false; });
  }
  V.addEventListener('timeupdate', () => { if (!flexing && !V.paused) { V.pause(); V.currentTime = 0; } });
  V.addEventListener('ended', () => { flexing = false; V.currentTime = 0; });
  function flex() { flexing = true; V.currentTime = 0; const p = V.play(); if (p && p.catch) p.catch(() => { flexing = false; }); }

  addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  C.addEventListener('pointermove', e => { mouse.tx = e.clientX; mouse.ty = e.clientY; mouse.inside = true; });
  C.addEventListener('pointerleave', () => { mouse.inside = false; mouse.tx = -1e4; mouse.ty = -1e4; });
  C.addEventListener('pointerdown', e => { ripple(e.clientX, e.clientY, 0.6, 1200); prime(); if (!asked) ask(byId.hello, ''); });
  addEventListener('pointerdown', prime, { once: true });
  addEventListener('keydown', prime, { once: true });

  const th = new URLSearchParams(location.search).get('theme');
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  theme(); resize(); requestAnimationFrame(frame);

  // ---------- conversation ----------
  const $q = document.getElementById('q'), $hint = document.getElementById('hint'), $sug = document.getElementById('suggest');
  const $say = document.getElementById('say'), $you = document.getElementById('you'), $chips = document.getElementById('chips');
  const STOP = new Set('what are you your do does the a an is i me my of to and can could would tell on in for it that with be have has was were am some any please u ur'.split(' '));
  let QA = null, byId = {}, asked = false, active = -1, list = [], typing = 0, idleTimer = 0;

  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9+ ]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));

  function match(text) {
    const toks = norm(text); if (!toks.length) return [];
    const phrase = toks.join(' ');
    return QA.items.map(it => {
      let s = 0;
      for (const t of toks) {
        if (it.kw.has(t)) s += 3;
        else if (t.length >= 3 && it.kwArr.some(k => k.startsWith(t))) s += 1.5;
      }
      if (it.qn.includes(phrase)) s += 2;
      return { it, s };
    }).filter(m => m.s > 0).sort((a, b) => b.s - a.s).map(m => m.it);
  }

  function showSuggest(items) {
    list = items.slice(0, 4); active = -1;
    $sug.innerHTML = '';
    list.forEach((it, i) => { const li = document.createElement('li'); li.textContent = it.q; li.setAttribute('role', 'option'); li.addEventListener('pointerdown', e => { e.preventDefault(); ask(it, ''); }); $sug.appendChild(li); });
  }
  function setActive(i) { active = i; [...$sug.children].forEach((li, j) => li.classList.toggle('active', j === i)); }
  function starters() { return QA.starters.map(id => byId[id]); }

  function chips(links, next) {
    $chips.innerHTML = '';
    let delay = 0;
    (links || []).forEach(l => { const a = document.createElement('a'); a.className = 'chip link'; a.href = l.u; a.textContent = l.t; a.style.animationDelay = (delay += 60) + 'ms'; $chips.appendChild(a); });
    (next || []).forEach(id => { const it = byId[id]; if (!it) return; const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = it.q; b.style.animationDelay = (delay += 60) + 'ms'; b.addEventListener('click', () => ask(it, '')); $chips.appendChild(b); });
  }

  function say(text, done) {
    clearTimeout(typing);
    $say.textContent = ''; $say.classList.add('show');
    const caret = document.createElement('span'); caret.className = 'caret';
    const node = document.createTextNode(''); $say.append(node, caret);
    speaking = true; let i = 0, lastRip = 0;
    const step = () => {
      node.data = text.slice(0, ++i);
      const ch = text[i - 1];
      const now = performance.now();
      if (now - lastRip > 110) { ripple(mouth.x, mouth.y, 0.3, 800); lastRip = now; }
      if (i < text.length) typing = setTimeout(step, reduce ? 0 : (/[.,;:!?]/.test(ch) ? 190 : 22));
      else { speaking = false; caret.remove(); done && done(); }
    };
    step();
  }

  function ask(it, userText) {
    asked = true; clearTimeout(idleTimer);
    $you.textContent = userText || it.q; $you.classList.add('show');
    $q.value = ''; $hint.classList.remove('hide'); showSuggest([]); $chips.innerHTML = '';
    if (innerWidth < 700) $q.blur();
    if (it.flex) flex();
    history.replaceState(null, '', '#' + it.id);
    say(it.a, () => chips(it.links, it.next));
  }
  function askText(text) {
    const m = match(text);
    if (m.length) return ask(m[0], text);
    asked = true; $you.textContent = text; $you.classList.add('show'); $q.value = ''; showSuggest([]); $chips.innerHTML = '';
    say(QA.fallback, () => chips([], QA.starters));
  }

  // hints cycle while the field is empty and unfocused
  const HINTS = ['Ask me anything', 'Ask what I am working on', 'Ask what I can build', 'Ask about the piano tools', 'Say hello', 'Ask if I am real'];
  let hi = 0;
  setInterval(() => { if ($q.value || document.activeElement === $q) return; $hint.classList.add('hide'); setTimeout(() => { hi = (hi + 1) % HINTS.length; $hint.textContent = HINTS[hi]; $hint.classList.remove('hide'); }, 500); }, 4200);

  $q.addEventListener('focus', () => { if (!QA) return; $hint.classList.add('hide'); if (!asked) { clearTimeout(idleTimer); $chips.innerHTML = ''; } if (!$q.value) showSuggest(starters()); });
  $q.addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== $q) { showSuggest([]); if (!$q.value) $hint.classList.remove('hide'); } }, 150); });
  $q.addEventListener('input', () => {
    if (!QA) return;
    $hint.classList.toggle('hide', true);
    const v = $q.value.trim();
    if (!v) { showSuggest(starters()); return; }
    const m = match(v);
    showSuggest(m.length ? m : starters());
    if (v.length % 3 === 0) ripple(mouth.x, mouth.y, 0.25, 600);
  });
  $q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && list.length) { e.preventDefault(); setActive((active + 1) % list.length); }
    else if (e.key === 'ArrowUp' && list.length) { e.preventDefault(); setActive((active - 1 + list.length) % list.length); }
    else if (e.key === 'Escape') { if ($q.value) { $q.value = ''; showSuggest(starters()); } else $q.blur(); }
  });
  document.getElementById('ask').addEventListener('submit', e => {
    e.preventDefault(); if (!QA) return;
    const v = $q.value.trim();
    if (active >= 0 && list[active]) return ask(list[active], v);
    if (!v) return ask(byId.hello, '');
    askText(v);
  });
  addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $q) { e.preventDefault(); $q.focus(); } });

  fetch('qa.json').then(r => r.json()).then(d => {
    QA = d;
    for (const it of QA.items) { it.kwArr = [...new Set([...it.k, ...norm(it.q)].map(k => norm(k).join(' ')).filter(Boolean))]; it.kw = new Set(it.kwArr); it.qn = norm(it.q).join(' '); byId[it.id] = it; }
    const h = location.hash.slice(1);
    if (h && byId[h]) setTimeout(() => ask(byId[h], ''), 600);
    else idleTimer = setTimeout(() => { if (!asked) chips([], QA.starters); }, 7000);
  });
})();
</script>
</body>
</html>
