<style>
  :root { --bg:#0d0f14; --ink:#ece9e2; --muted:#a3a5ae; --line:rgba(255,255,255,.15); --card:rgba(20,22,29,.9); --accent:#ffc978; --accent-ink:#1d1508; --err:#ff9d94; --err-bg:rgba(255,120,110,.12);

  * { box-sizing:border-box; }

  html,body { height:100%; overflow:hidden; }

  #output .display mjx-container { margin:0 !important; min-width:max-content; }
  #output .empty { color:var(--muted); font-family:var(--sans); font-size:.92rem; }
  .pending { font-family:var(--mono); font-size:.86em; color:var(--muted); }

<body>
<div id="app">
  <header id="top">
    <a id="home" class="glass" href="./">← Home</a>
    <h1>LaTeX editor</h1>
    <div id="actions">
      <button class="btn" id="clearBtn" type="button">Clear</button>
      <button class="btn" id="sampleBtn" type="button">Sample</button>
      <button class="btn" id="shareBtn" type="button">Copy link</button>
      <button class="btn primary" id="pdfButton" type="button">Download PDF</button>
    </div>
  </header>

  <main id="panes">
    <section id="editorPane" class="pane glass" aria-label="Source">
      <div class="head"><label for="latexInput">Source</label><span id="saved" class="state"></span></div>
      <div id="bar" role="toolbar" aria-label="Insert math"></div>
      <textarea id="latexInput" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Type text and math here, for example: The area is \( \pi r^2 \)."></textarea>
      <p id="help">Math goes in <code>\( \)</code>, <code>\[ \]</code>, <code>$ $</code>, <code>$$ $$</code> or environments such as <code>align</code>. Write <code>\$</code> for a dollar sign. Everything else stays plain text.</p>
    </section>
    <section id="previewPane" class="pane glass" aria-label="Preview">
      <div class="head"><h2>Preview</h2><span id="state" class="state" role="status">Loading math…</span></div>
      <ul id="errors" hidden aria-label="Math errors"></ul>
      <div id="output" tabindex="0" aria-label="Rendered document"></div>
    </section>
  </main>
</div>
<div id="note" class="glass" role="status" hidden></div>

<script>
'use strict';
const SAMPLE = String.raw`Let \( f \) and \( g \) be continuously differentiable on \( [a, b] \). Integration by parts says

\[
\int_a^b f(x)\, g'(x) \, dx = f(b)g(b) - f(a)g(a) - \int_a^b f'(x)\, g(x) \, dx.
\]

Now consider the alternating series

\[
S = \sum_{n=1}^{\infty} \frac{(-1)^n}{n^2} = -\frac{\pi^2}{12},
\]

and for each \( n \) define the matrix

\[
A_n = \left[ \begin{array}{cc}
\frac{(-1)^n}{n^2} & 0 \\
0 & \frac{(-1)^n}{n^2}
\end{array} \right],
\qquad \text{so that} \qquad
\sum_{n=1}^{\infty} \text{Tr}(A_n) = 2S = -\frac{\pi^2}{6}.
\]

Aligned steps use the align environment:

\begin{align}
(a + b)^2 &= (a + b)(a + b) \\
          &= a^2 + 2ab + b^2.
\end{align}

Piecewise definitions use cases:

\[
|x| = \begin{cases}
  x  & \text{if } x \ge 0, \\
  -x & \text{if } x < 0.
\end{cases}
\]

Single dollar signs work inline too: the roots of $ax^2 + bx + c = 0$ are $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$. Double dollar signs give a display:

$$
\det \begin{pmatrix} a & b \\ c & d \end{pmatrix} = ad - bc,
\qquad
\int_{-\infty}^{\infty} e^{-x^2} \, dx = \sqrt{\pi}.
$$

Ordinary prices stay as text: a coffee costs $5 and a sandwich costs $10.
`;

const STORE_KEY = 'latex-draft';
const CDN = 'https://cdn.jsdelivr.net/npm/';
const MATHJAX_URL = CDN + 'mathjax@3.2.2/es5/tex-svg-full.js';
const PDF_LIBS = [CDN + 'jspdf@4.2.1/dist/jspdf.umd.min.js', CDN + 'svg2pdf.js@2.8.1/dist/svg2pdf.umd.min.js'];
const UNICODE_FONT = CDN + 'dejavu-fonts-ttf@2.37.3/ttf/DejaVuSerif.ttf';
const MAX_LINK_CHARS = 20000;

const $ = id => document.getElementById(id);
const ta = $('latexInput'), output = $('output'), stateEl = $('state'), errorsEl = $('errors'), savedEl = $('saved'), noteEl = $('note'), pdfBtn = $('pdfButton');
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

/* ---------- Messages ---------- */
let noteTimer = 0;
function showNote(text, opts = {}) {
  clearTimeout(noteTimer);
  noteEl.replaceChildren(el('span', '', text));
  if (opts.field) {
    const f = el('input'); f.readOnly = true; f.value = opts.field; f.setAttribute('aria-label', 'Share link');
    noteEl.append(f); setTimeout(() => { f.focus(); f.select(); });
  }
  if (opts.action) {
    const b = el('button', 'btn small', opts.action.label); b.type = 'button';
    b.onclick = () => { hideNote(); opts.action.run(); };
    noteEl.append(b);
  }
  if (opts.sticky) {
    const x = el('button', 'btn small', 'Dismiss'); x.type = 'button'; x.onclick = hideNote;
    noteEl.append(x);
  } else {
    noteTimer = setTimeout(hideNote, opts.action ? 12000 : 6000);
  }
  noteEl.hidden = false;
}
function hideNote() { clearTimeout(noteTimer); noteEl.hidden = true; noteEl.replaceChildren(); }

/* ---------- Reading the source: text and math, never HTML ---------- */
function closeOfEscaped(s, from, closer) {
  const opener = closer === ')' ? '(' : '[';
  for (let j = from; j < s.length - 1; j++) {
    if (s[j] === '\\') {
      if (s[j + 1] === closer) return j;
      if (s[j + 1] === opener) return -1; /* the first one was never closed */
      j++;

  }
  return -1;
}
function closeOfDoubleDollar(s, from) {
  for (let j = from; j < s.length - 1; j++) {
    if (s[j] === '\\') j++;
    else if (s[j] === '$' && s[j + 1] === '$') return j;
  }
  return -1;
}
/* A single $ opens math only when it looks like math, so that "$5 and $10" stays text. */
function closeOfDollar(s, from) {
  const c0 = s[from];
  if (c0 === undefined || /\s/.test(c0)) return -1;

    if (s[j] === '\\') { j++; continue; }
    if (s[j] === '\n' && /^\n[ \t]*\n/.test(s.slice(j, j + 40))) return -1;
    if (s[j] === '$') {
      if (/\s/.test(s[j - 1]) || /\d/.test(s[j + 1] || '')) return -1;

      if (/^\d[\d.,]*\s/.test(inner) && /(^|[\s(])[a-z]{2,}([\s.,;:)]|$)/i.test(inner)) return -1;

}
function closeOfBacktick(s, from) {
  for (let j = from; j < s.length; j++) {
    if (s[j] === '\n' && /^\n[ \t]*\n/.test(s.slice(j, j + 40))) return -1;
    if (s[j] === '`') return j;

  return -1;
}
function endOfEnv(s, name, from) {
  const safe = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\\\(begin|end)\\{' + safe + '\\}', 'g');
  re.lastIndex = from;
  let depth = 1, m;
  while ((m = re.exec(s))) {
    depth += m[1] === 'begin' ? 1 : -1;
    if (!depth) return re.lastIndex;

function tokenize(s) {

      if (j < 0) bad(2, 'Missing $$ to close this $$');
      else math(s.slice(i + 2, j), true, 'tex', j + 2);
      continue;
    }
    if (c === '$') {
      const j = closeOfDollar(s, i + 1);
      if (j < 0) add('$', 1);
      else math(s.slice(i + 1, j), false, 'tex', j + 1);
      continue;
    }
    if (c === '`') {
      const j = closeOfBacktick(s, i + 1);
      if (j < 0) add('`', 1);

}
function toBlocks(tokens) {
  const blocks = []; let para = null;
  const close = () => {
    if (!para) return;
    const items = para.items, first = items[0], last = items[items.length - 1];
    if (first && first.k === 'text') first.text = first.text.replace(/^\s+/, '');
    if (last && last.k === 'text') last.text = last.text.replace(/\s+$/, '');
    para.items = items.filter(t => t.k !== 'text' || t.text);
    if (para.items.length) blocks.push(para);
    para = null;
  };
  const open = at => { if (!para) para = { k: 'para', items: [], start: at, end: at }; return para; };
  for (const t of tokens) {
    if (t.k === 'math' && t.display) { close(); blocks.push({ k: 'display', math: t, start: t.start, end: t.end }); continue; }
    if (t.k !== 'text') { const p = open(t.start); p.items.push(t); p.end = t.end; continue; }

    const push = (text, at, end) => { if (text) { const p = open(at); p.items.push({ k: 'text', text }); p.end = end; } };

      push(t.text.slice(last, m.index), t.start + last, t.start + m.index);
      close(); last = re.lastIndex;
    }
    push(t.text.slice(last), t.start + last, t.end);
  }
  close();
  return blocks;

/* ---------- MathJax ---------- */
let mathReady = false, mathFailed = false;
const DEFINES = /\\(?:newcommand|renewcommand|providecommand|def|let|DeclareMathOperator|newenvironment|renewenvironment)(?![a-zA-Z])/;
let cache = new Map();

/* Packages that make links, inject classes or styles, or fetch code (html, action, bbox, require, autoload, unicode) stay off. */
window.MathJax = {
  /* AsciiMath is an optional extra download. If it fails, TeX still starts and backtick math reports an error. */
  loader: { load: ['input/asciimath'], failed() { startMath(); } },
  startup: { typeset: false, ready() { startMath(); } },
  tex: { packages: ['base', 'ams', 'amscd', 'newcommand', 'mathtools', 'boldsymbol', 'braket', 'cancel', 'cases', 'centernot', 'color', 'colortbl', 'empheq', 'enclose', 'extpfeil', 'gensymb', 'mhchem', 'textcomp', 'upgreek', 'verb'] },
  svg: { fontCache: 'none' },

function startMath() {
  try {
    MathJax.startup.defaultReady();

      document.head.append(MathJax.svgStylesheet());
      mathReady = true;
      renderNow();

}
function mathLoadFailed() {

}
function resetDefinitions() {

/* Base TeX still lets \mmlToken and \color set attributes, so everything active is removed from the output.

const PLAIN_COLOR = /^(?:currentcolor|none|transparent|[a-z]+|#[0-9a-f]{3,8}|rgba?\([\d.,\s%]+\))$/i;
const LOADS_SOMETHING = /url|image-set|image\(|@import|expression|\\/i;

      problems.push('The extra font did not load, so accented text is drawn as images.');
    }
  }
  shrunk = 0;
  const boxes = layout(doc, blocks, fonts, W, H);
  if (shrunk) problems.push(shrunk === 1 ? 'One large formula was shrunk to fit the page.' : `${shrunk} large formulas were shrunk to fit the page.`);
  const pages = paginate(boxes, PDF.margin, pageH - PDF.margin);
  let drawn = 0;
  for (let p = 0; p < pages.length; p++) {
    if (p) doc.addPage();
    for (const { box, y } of pages[p]) {
      await box.draw(y);
      if (++drawn % 25 === 0) await nextFrame();
    }
    if (pages.length > 1) {
      doc.setFont('times', 'normal'); doc.setFontSize(9.5); doc.setTextColor('#555555');
      doc.text(String(p + 1), pageW / 2, pageH - 34, { align: 'center' });
    }
  }
  doc.setProperties({ title: 'LaTeX document', subject: 'Exported from the LaTeX editor' });
  return { doc, pages: pages.length, problems };
}
pdfBtn.onclick = async () => {
  if (renderTimer || !current.blocks.length) renderNow();
  if (!current.blocks.length) { showNote('There is nothing to export yet.'); return; }
  if (!mathReady) { showNote(mathFailed ? 'The math engine did not load, so a PDF cannot be made. Reload to try again.' : 'Math is still loading. Try again in a moment.'); return; }
  const label = pdfBtn.textContent;
  pdfBtn.disabled = true; pdfBtn.textContent = 'Preparing…';
  try {
    const { doc, pages, problems } = await buildPdf(current.blocks);
    doc.save('latex_equation.pdf');
    const bad = current.errors.length;
    const parts = [`Downloaded latex_equation.pdf, ${pages} ${pages === 1 ? 'page' : 'pages'}.`];
    if (bad) parts.push(bad === 1 ? 'The math error is shown in red.' : `The ${bad} math errors are shown in red.`);
    showNote(parts.concat(problems).join(' '));
  } catch (e) {
    console.warn(e);
    showNote('The PDF could not be made. Check your connection and try again, or use your browser\'s Print command to save a PDF.', { sticky: true });
  } finally {
    pdfBtn.disabled = false; pdfBtn.textContent = label;
  }
};

/* ---------- Start ---------- */
function start() {
  if (!openFromHash()) {
    const draft = readDraft();
    ta.value = draft === null ? SAMPLE : draft;
  }
  renderNow();
  if (!storageOk) savedEl.textContent = 'Draft cannot be saved here';
  else if (readDraft() !== null && !holdingShared) savedEl.textContent = 'Draft saved in this browser';
  const s = document.createElement('script');
  s.src = MATHJAX_URL; s.async = true;
  s.onerror = mathLoadFailed;
  document.head.append(s);
}
start();
</script>
