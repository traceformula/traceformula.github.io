let toastT = 0; function toast(t, ms = 6500) { const e = J('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), ms); }
let pool = [], lastPick = -1;
function surprise() {
  if (!pool.length) { DATA.bodies.forEach(b => b.facts.forEach(t => pool.push({ t, body:b.id }))); DATA.general.forEach(g => pool.push({ t:g.t, cons:g.go })); Object.entries(DATA.constellations).forEach(([k,v]) => (v[1]||[]).forEach(t => pool.push({ t, cons:k }))); }

let orbitsOn = true; J('bOrbits').onclick = e => { orbitsOn = !orbitsOn; e.target.setAttribute('aria-pressed', orbitsOn); };

addEventListener('keydown', e => { if (e.key === 'Escape') { if (panelMode) closePanel(); else overview(); } });

// click on the canvas selects the nearest object on screen
let downAt = null; const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; if (fly) fly = null; });
canvas.addEventListener('pointerup', e => { if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return; let best = null, bd = 30; for (const id of ORDER) { if (id === 'moon' && focus !== 'earth' && focus !== 'moon') continue; v3.copy(B[id].pos).project(camera); if (v3.z >= 1) continue; const d = Math.hypot((v3.x+1)/2*W - e.clientX, (1-v3.y)/2*H - e.clientY); if (d < bd) { bd = d; best = id; } } if (best) selectBody(best); });

function resize() { W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); setViewOffset(); }
addEventListener('resize', resize);

// ---------- frame ----------
function poseBody(b, d) {

  const e = new THREE.Vector3().crossVectors(p, n), w = wDeg * RAD, X = n.clone().multiplyScalar(Math.cos(w)).addScaledVector(e, Math.sin(w)), Z = new THREE.Vector3().crossVectors(X, p);
