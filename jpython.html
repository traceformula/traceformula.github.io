<script type="text/plain" class="example" data-name="Sine wave with sliders">
# Drag the sliders: this script reruns each time.
import matplotlib.pyplot as plt
import numpy as np

# The two sliders set these variables.
freq = SINE_WAVE_FREQUENCY
amp = SINE_WAVE_AMP

x = np.linspace(0, 10, 500)
y = amp * np.sin(freq * x)

plt.plot(x, y)
plt.ylim(-5.5, 5.5)
plt.title("Interactive sine wave")
plt.xlabel("x")
plt.ylabel("y")
plt.show()

print(f"y = {amp:g} * sin({freq:g} * x)")
</script>
<script type="text/plain" class="example" data-name="Primes (no packages)">
# Uses only the standard library, so it runs without any extra download.
from collections import Counter


def primes_below(n):
    sieve = [True] * n
    sieve[0:2] = [False, False]
    for i in range(2, int(n ** 0.5) + 1):
        if sieve[i]:
            sieve[i * i :: i] = [False] * len(range(i * i, n, i))
    return [i for i, is_prime in enumerate(sieve) if is_prime]


primes = primes_below(100)
print(f"{len(primes)} primes below 100:")
print(primes)

print("\nHow often each last digit appears:")
for digit, count in sorted(Counter(p % 10 for p in primes).items()):
    print(f"  {digit}: {'#' * count} {count}")
</script>
<script type="text/plain" class="example" data-name="NumPy statistics">
# A seeded generator gives the same numbers on every run.
import matplotlib.pyplot as plt
import numpy as np

rng = np.random.default_rng(42)
scores = rng.normal(loc=100, scale=15, size=10_000)

mean = scores.mean()
std = scores.std()
within_one_std = np.mean(np.abs(scores - mean) <= std)

print(f"mean:   {mean:.2f}")
print(f"std:    {std:.2f}")
print(f"median: {np.median(scores):.2f}")
print(f"within one std of the mean: {within_one_std:.1%}")

plt.hist(scores, bins=40)
plt.axvline(mean, color="black", linestyle="--", label="mean")
plt.title("10,000 samples from a normal distribution")
plt.xlabel("score")
plt.ylabel("count")
plt.legend()
plt.show()
</script>
<script type="text/plain" class="example" data-name="Mandelbrot set">
import matplotlib.pyplot as plt
import numpy as np

STEPS = 60

x = np.linspace(-2.2, 0.8, 600)
y = np.linspace(-1.0, 1.0, 400)
c = x[np.newaxis, :] + 1j * y[:, np.newaxis]
z = np.zeros_like(c)
steps_bounded = np.zeros(c.shape, dtype=int)

for _ in range(STEPS):
    bounded = np.abs(z) <= 2
    z[bounded] = z[bounded] ** 2 + c[bounded]
    steps_bounded += bounded

share = np.mean(steps_bounded == STEPS)
print(f"{share:.1%} of this view is still bounded after {STEPS} steps.")

plt.imshow(steps_bounded, extent=(-2.2, 0.8, -1.0, 1.0), origin="lower", cmap="magma")
plt.title("Mandelbrot set")
plt.xlabel("real part")
plt.ylabel("imaginary part")
plt.show()
</script>
<script type="text/plain" class="example" data-name="An error, on purpose">
# Output printed before the error stays, and the traceback points at the line.
def average(values):
    return sum(values) / len(values)


def report(groups):
    for name, values in groups.items():
        print(name, average(values))


report({"first": [1, 2, 3], "second": [10, 20], "empty": []})
</script>

<script type="text/plain" class="example" data-name="GeoTIFF with rasterio (large download)">
# Writes a small raster to an in-memory GeoTIFF, reads it back and plots it.
import matplotlib.pyplot as plt
import numpy as np
import rasterio
from rasterio.io import MemoryFile
from rasterio.transform import from_origin

rows, cols = np.mgrid[0:100, 0:150]
surface = (np.sin(cols / 12) + np.cos(rows / 9)).astype("float32")

with MemoryFile() as memfile:
    with memfile.open(
        driver="GTiff",
        height=surface.shape[0],
        width=surface.shape[1],
        count=1,
        dtype="float32",
        crs="EPSG:4326",
        transform=from_origin(100.0, 20.0, 0.1, 0.1),
    ) as dataset:
        dataset.write(surface, 1)

    with memfile.open() as dataset:
        print("rasterio", rasterio.__version__)
        print("driver:", dataset.driver)
        print("size:", dataset.width, "x", dataset.height)
        print("crs:", dataset.crs)
        print("bounds:", tuple(dataset.bounds))
        band = dataset.read(1)
        bounds = dataset.bounds

print("values match:", bool(np.array_equal(band, surface)))

plt.imshow(band, extent=(bounds.left, bounds.right, bounds.bottom, bounds.top), cmap="viridis")
plt.colorbar(label="value")
plt.title("Raster read back from a GeoTIFF")
plt.xlabel("longitude")
plt.ylabel("latitude")
plt.show()
</script>

<!-- Runs in a Web Worker: sets up Python and runs one script at a time. -->
<script type="text/python" id="bootSource">
import base64, io, json, linecache, logging, os, re, sys, time, traceback
import __main__
from js import console as _console
from pyodide.code import eval_code_async

# The default browser backend needs the page's DOM, which a worker does not have.
os.environ["MPLBACKEND"] = "AGG"

FILENAME = "main.py"
_pending = []
_window_start = 0.0
_sent = 0


def flush_output():
    global _window_start, _sent
    if _pending:
        stream = _pending[0][0]
        chunk = []
        for item in _pending:
            if item[0] != stream:
                emit(stream, "".join(chunk))
                stream, chunk = item[0], []
            chunk.append(item[1])
        emit(stream, "".join(chunk))
        _pending.clear()
        _sent += 1


def write_output(stream, text):
    # Normal scripts stream at once. A tight print loop gets batched so that it
    # cannot flood the page with messages.
    global _window_start, _sent
    _pending.append((stream, text))
    now = time.monotonic()
    if now - _window_start > 0.05:
        _window_start, _sent = now, 0
    if _sent < 20:
        flush_output()


class Stream(io.TextIOBase):
    encoding = "utf-8"
    errors = "replace"

    def __init__(self, stream):
        self._stream = stream

    def writable(self):
        return True

    def isatty(self):
        return False

    def write(self, text):
        if text:
            write_output(self._stream, str(text))
        return len(text)

    def flush(self):
        flush_output()


_stdout = Stream("out")
_stderr = Stream("err")


def show_figures(*args, **kwargs):
    import matplotlib.pyplot as plt

    flush_output()
    for num in plt.get_fignums():
        fig = plt.figure(num)
        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=144)
        titles = [ax.get_title() for ax in fig.axes if ax.get_title()]
        if getattr(fig, "_suptitle", None):
            titles.insert(0, fig._suptitle.get_text())
        alt = "Plot: " + ", ".join(titles) if titles else "Plot"
        plot(base64.b64encode(buf.getvalue()).decode("ascii"), float(fig.get_size_inches()[0] * 100), alt)
    plt.close("all")


def describe_error(exc):
    tb = exc.__traceback__
    while tb is not None and tb.tb_frame.f_code.co_filename != FILENAME:
        tb = tb.tb_next
    line = None
    walk = tb
    while walk is not None:
        if walk.tb_frame.f_code.co_filename == FILENAME:
            line = walk.tb_lineno
        walk = walk.tb_next
    if isinstance(exc, SyntaxError) and exc.filename == FILENAME:
        line = exc.lineno
    hint = None
    message = str(exc)
    if isinstance(exc, EOFError):
        hint = "input() cannot pause a script on this page. Set the value in your code instead."
    elif isinstance(exc, (ImportError, AttributeError)) and re.search(r"\b(document|window|alert|prompt)\b", message):
        hint = "Python runs in a background worker here so that Stop can work, and a worker cannot reach the page (document, window, alert)."
    return {
        "ok": False,
        "error": "".join(traceback.format_exception(type(exc), exc, tb)),
        "summary": "".join(traceback.format_exception_only(type(exc), exc)).strip(),
        "line": line,
        "hint": hint,
    }


async def run(code, frequency, amplitude, uses_pyplot):
    g = __main__.__dict__
    g["SINE_WAVE_FREQUENCY"] = frequency
    g["SINE_WAVE_AMP"] = amplitude
    # Earlier versions of this page left these names defined, so scripts in old
    # share links may use them without importing them.
    g.setdefault("sys", sys)
    g.setdefault("io", io)
    g.setdefault("base64", base64)
    g.setdefault("console", _console)

    if uses_pyplot or "matplotlib.pyplot" in sys.modules:
        # A fresh Python rebuilds the font cache, and says so on stderr.
        logging.getLogger("matplotlib.font_manager").setLevel(logging.ERROR)
        import matplotlib
        import matplotlib.pyplot as plt

        plt.show = show_figures
        plt.close("all")
        g.setdefault("matplotlib", matplotlib)
        g.setdefault("plt", plt)

    sys.stdout, sys.stderr, sys.stdin = _stdout, _stderr, io.StringIO("")
    linecache.cache[FILENAME] = (len(code), None, code.splitlines(True), FILENAME)

    result = {"ok": True}
    try:
        await eval_code_async(code, g, filename=FILENAME)
    except SystemExit as exc:
        if exc.code not in (None, 0):
            result = {"ok": False, "error": f"SystemExit: {exc.code}\n", "summary": f"SystemExit: {exc.code}", "line": None, "hint": None}
    except BaseException as exc:
        result = describe_error(exc)

    if "matplotlib.pyplot" in sys.modules:
        try:
            show_figures()
        except Exception as exc:
            if result["ok"]:
                result = describe_error(exc)
    sys.stdout, sys.stderr = _stdout, _stderr
    flush_output()
    return json.dumps(result)
</script>

<script type="text/plain" id="workerSource">
let py, runFn;
const toStatus = (text) => postMessage({ type: 'status', text });
const onPackageMessage = (msg) => { if (/^Loading /.test(msg)) toStatus(msg.replace(/^Loading /, 'Downloading ').slice(0, 120) + '…'); };
const onPackageError = (msg) => postMessage({ type: 'text', stream: 'err', text: msg + '\n' });

async function init(m) {
  try {
    importScripts(m.base + 'pyodide.js');
    py = await loadPyodide({

  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.defaultPrevented) { e.preventDefault(); requestRun(); }
  });
  $('runKey').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘↵' : 'Ctrl+↵';
  $('runKey').setAttribute('aria-hidden', 'true');
  runBtn.setAttribute('aria-keyshortcuts', 'Control+Enter Meta+Enter');
  $('otherPage').addEventListener('click', (e) => {
    const code = getCode();
    if (code === examples[0].code) return;
    try { e.currentTarget.href = e.currentTarget.getAttribute('href').split('?')[0] + '?code=' + encodeCode(code); } catch (err) { /* open without the code */ }
  });

  // ---------- Sliders ----------
  for (const id of ['frequency', 'amplitude']) {
    const slider = $(id);
    const show = () => { $(id + 'Value').textContent = slider.value; };
    const shared = new URLSearchParams(location.search).get(id);
    if (shared !== null && shared.trim() !== '' && Number.isFinite(Number(shared))) slider.value = shared;
    show();
    slider.addEventListener('input', () => { show(); requestRun(true); });
  }

  // ---------- Start ----------
  let sharedCode = null;
  try {
    sharedCode = readSharedCode();
  } catch (e) {
    notice('The code in this link could not be read, so an example was loaded instead.', { error: true });
  }
  setCode(sharedCode !== null ? sharedCode : examples[0].code);
  emptyMessage(emptyText);
  const pref = getPref();
  monacoWanted = pref ? pref === 'monaco' : !(matchMedia('(pointer: coarse)').matches || innerWidth < 700);
  showEditor();
  if (monacoWanted) loadMonaco();
  startWorker();
})();
</script>
</body>
</html>
